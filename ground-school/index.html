<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ground School</title>
<meta name="description" content="FAA Private Pilot ground school hub: learn, drill, review and test each chapter in course order, plus the FAA sample exam with figures.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#080A10">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23080A10'/%3E%3Cpath d='M16 5l2.2 8.2 8.8 2.8-8.8 2.8L16 27l-2.2-8.2L5 16l8.8-2.8z' fill='%23E8B620'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080A10; --surface: #0E1118; --border: #1E2438; --text: #DDE0EC;
    --muted: #8A93A8; --gold: #C49A0C; --gold-lt: #E8B620;
    --gold-dim: rgba(196,154,12,0.11); --gold-rim: rgba(196,154,12,0.28);
    --green: #2D9966; --green-dim: rgba(45,153,102,0.11); --green-rim: rgba(45,153,102,0.30);
    --red: #C25050; --red-dim: rgba(194,80,80,0.12); --red-rim: rgba(194,80,80,0.35);
    --r: 10px; --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace; --sans: 'DM Sans', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); line-height: 1.5; }
  a { color: var(--gold-lt); }
  .wrap { max-width: 880px; margin: 0 auto; padding: 24px 16px 90px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
    font: 500 12px var(--mono); color: var(--muted); margin-bottom: 22px; }
  .topbar a { color: var(--muted); text-decoration: none; }
  .topbar a:hover { color: var(--gold-lt); }
  .eyebrow { font: 600 11px var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; }
  h1 { font-size: 26px; margin: 0 0 6px; line-height: 1.2; }
  h1 .score { color: var(--green); font-size: 22px; }
  h1 .score.fail { color: var(--red); }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 22px; }
  .sub a { color: var(--muted); }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 16px 18px; margin-bottom: 14px; }
  .label { font: 600 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .big { font: 600 22px var(--mono); color: var(--gold-lt); }
  .bar { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--gold); }
  .bar > i.done { background: var(--green); }
  .bar > i.fail { background: var(--red); }
  .stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 12px; }
  .stat { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; text-align: center; padding: 10px 4px; }
  .stat b { display: block; font: 600 20px var(--mono); color: var(--text); }
  .stat span { font: 500 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .stage-label { font: 600 11px var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin: 22px 0 8px; display: flex; align-items: center; gap: 10px; }
  .stage-label::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .chap { display: grid; grid-template-columns: 34px 1fr auto; gap: 4px 12px; align-items: center;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--r);
    padding: 11px 14px; margin-bottom: 8px; cursor: pointer; text-decoration: none; color: inherit; }
  .chap:hover, .chap:focus-visible { border-color: var(--gold-rim); outline: none; }
  .chap .num { font: 600 13px var(--mono); color: var(--muted); }
  .chap .title { font-weight: 600; font-size: 14.5px; }
  .chap .meta { font: 500 11px var(--mono); color: var(--muted); }
  .chap .pct { font: 600 13px var(--mono); color: var(--gold-lt); text-align: right; }
  .chap .pct.done { color: var(--green); }
  .chap .pct.fail { color: var(--red); }
  .chap .cbar { grid-column: 2 / 4; }
  .chips { display: flex; gap: 6px; grid-column: 2 / 4; margin-top: 2px; flex-wrap: wrap; }
  .chip { font: 500 10px var(--mono); letter-spacing: .08em; text-transform: uppercase;
    border: 1px solid var(--border); border-radius: 4px; padding: 2px 7px; color: var(--muted); }
  .chip.on { color: var(--gold-lt); border-color: var(--gold-rim); background: var(--gold-dim); }
  .chip.tool { color: var(--green); border-color: var(--green-rim); background: var(--green-dim); }
  .exam-row { border-style: dashed; }
  .exam-row .title { color: var(--gold-lt); }
  .exam-row.live { border-style: solid; border-color: var(--gold-rim); }
  .btn { font: 600 12px var(--mono); letter-spacing: .08em; text-transform: uppercase;
    background: var(--gold); color: #0A0800; border: none; border-radius: 6px;
    padding: 8px 14px; cursor: pointer; text-decoration: none; display: inline-block; line-height: 1.4; }
  .btn:hover { background: var(--gold-lt); }
  .btn.ghost { background: transparent; color: var(--text); border: 1.5px solid var(--border); }
  .btn.ghost:hover { border-color: var(--gold-rim); color: var(--gold-lt); background: transparent; }
  .btn.danger { background: transparent; color: var(--red); border: 1.5px solid var(--red-rim); }
  .btn.danger:hover { background: var(--red-dim); }
  .btn[disabled], .btn.disabled { opacity: .45; cursor: not-allowed; pointer-events: none; }
  .btn.small { padding: 6px 10px; font-size: 11px; }
  .back { font: 500 12px var(--mono); color: var(--muted); cursor: pointer; margin-bottom: 14px; display: inline-block; text-decoration: none; background: none; border: none; padding: 0; }
  .back:hover { color: var(--gold-lt); }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .mode { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 15px 16px; display: flex; flex-direction: column; }
  .mode h3 { margin: 0 0 2px; font-size: 15px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .mode p { font-size: 13px; color: var(--muted); margin: 6px 0 12px; flex: 1; }
  .mode p b { color: var(--gold-lt); font-weight: 600; }
  .mode .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .tag { font: 600 9.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; white-space: nowrap; }
  .tag.faa { color: var(--gold-lt); background: var(--gold-dim); border: 1px solid var(--gold-rim); }
  .tag.auth { color: var(--green); background: var(--green-dim); border: 1px solid var(--green-rim); }
  .tag.soon { color: var(--muted); background: transparent; border: 1px solid var(--border); }
  .note { font-size: 13px; color: var(--muted); }
  .note code { font: 500 12px var(--mono); color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; }
  .callout { border-left: 3px solid var(--gold); }
  /* exam runner */
  .qhead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; font: 500 12px var(--mono); color: var(--muted); margin-bottom: 14px; }
  .qhead b { color: var(--gold-lt); }
  .qhead .timer.low { color: var(--red); }
  .stem { font-size: 16.5px; font-weight: 600; margin-bottom: 14px; white-space: pre-line; }
  .qnote { font-size: 12px; color: var(--muted); margin: -6px 0 12px; }
  .fig { border: 1px solid var(--border); border-radius: 6px; background: #fff; margin-bottom: 14px; overflow: hidden; }
  .fig img { display: block; width: 100%; height: auto; cursor: zoom-in; }
  .fig.zoom img { cursor: zoom-out; }
  .fig.zoom { max-height: none; }
  .fig .cap { display: flex; justify-content: space-between; align-items: center; gap: 8px; font: 500 11px var(--mono); color: var(--muted); background: var(--bg); padding: 6px 10px; border-top: 1px solid var(--border); }
  .fig .cap a { color: var(--muted); }
  .fig.inline { display: inline-block; width: auto; background: transparent; border: none; margin: 0 0 12px; }
  .fig.inline img { width: auto; max-width: 100%; cursor: default; image-rendering: auto; height: 120px; }
  .opt { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; background: var(--bg); border: 1.5px solid var(--border);
    border-radius: 8px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer; font: inherit; font-size: 14.5px; color: var(--text); }
  .opt:hover { border-color: var(--gold-rim); }
  .opt.sel { border-color: var(--gold); background: var(--gold-dim); }
  .opt.right { border-color: var(--green); background: var(--green-dim); }
  .opt.wrong { border-color: var(--red); background: var(--red-dim); }
  .opt b { font: 600 13px var(--mono); color: var(--gold-lt); flex-shrink: 0; }
  .opt.right b { color: var(--green); }
  .opt.wrong b { color: var(--red); }
  .qnav { display: flex; justify-content: space-between; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .qnav .grp { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn.flagged { color: var(--gold-lt); border-color: var(--gold-rim); background: var(--gold-dim); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(36px, 1fr)); gap: 5px; margin-top: 10px; }
  .grid button { font: 600 11px var(--mono); background: var(--bg); color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 6px 0; cursor: pointer; }
  .grid button.ans { color: var(--text); border-color: var(--gold-rim); background: var(--gold-dim); }
  .grid button.flag { box-shadow: inset 0 -3px 0 var(--gold); }
  .grid button.cur { outline: 2px solid var(--gold-lt); outline-offset: -1px; }
  .grid button.miss { color: var(--red); border-color: var(--red-rim); background: var(--red-dim); }
  .grid button.hit { color: var(--green); border-color: var(--green-rim); background: var(--green-dim); }
  /* review */
  .acs { display: grid; grid-template-columns: minmax(150px, 220px) 1fr 56px; gap: 10px; align-items: center; font-size: 13px; margin-bottom: 7px; }
  .acs span:last-child { font: 600 12px var(--mono); color: var(--muted); text-align: right; }
  .rv { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; margin-bottom: 6px; font-size: 13.5px; cursor: pointer; }
  .rv:hover { border-color: var(--gold-rim); }
  .rv .ok { color: var(--green); font: 600 12px var(--mono); white-space: nowrap; }
  .rv .miss { color: var(--red); font: 600 12px var(--mono); white-space: nowrap; }
  .rv .ch { font: 500 11px var(--mono); color: var(--muted); }
  .hist { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 14px; font-size: 13px; align-items: baseline; }
  .hist .d { font: 500 12px var(--mono); color: var(--muted); }
  .hist .s { font: 600 13px var(--mono); }
  .hist .s.pass { color: var(--green); } .hist .s.fail { color: var(--red); }
  .hidden { display: none !important; }
  @media (max-width: 640px) {
    .modes { grid-template-columns: 1fr; } .stat-row { grid-template-columns: repeat(2, 1fr); }
    .acs { grid-template-columns: 1fr 56px; } .acs .bar { grid-column: 1 / 3; }
    h1 { font-size: 22px; }
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
</head>

</div>
